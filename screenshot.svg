<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bg)" width="1200" height="900"/>
  <!-- Header -->
  <rect fill="rgba(15,23,42,0.95)" width="1200" height="72"/>
  <rect fill="url(#accent)" x="40" y="22" width="120" height="28" rx="4"/>
  <!-- Cards -->
  <rect fill="#1e293b" x="40" y="120" width="1120" height="350" rx="16"/>
  <rect fill="url(#accent)" x="60" y="380" width="80" height="24" rx="12"/>
  <rect fill="#f8fafc" x="60" y="415" width="400" height="30" rx="4"/>
  <!-- Grid -->
  <rect fill="#ffffff" x="40" y="520" width="360" height="340" rx="12"/>
  <rect fill="#ffffff" x="420" y="520" width="360" height="340" rx="12"/>
  <rect fill="#ffffff" x="800" y="520" width="360" height="340" rx="12"/>
  <!-- Card images -->
  <rect fill="#1e293b" x="52" y="532" width="336" height="180" rx="8"/>
  <rect fill="#1e293b" x="432" y="532" width="336" height="180" rx="8"/>
  <rect fill="#1e293b" x="812" y="532" width="336" height="180" rx="8"/>
  <!-- Text lines -->
  <rect fill="#e2e8f0" x="52" y="730" width="250" height="14" rx="4"/>
  <rect fill="#e2e8f0" x="52" y="755" width="300" height="10" rx="4"/>
  <rect fill="#e2e8f0" x="432" y="730" width="250" height="14" rx="4"/>
  <rect fill="#e2e8f0" x="432" y="755" width="300" height="10" rx="4"/>
  <rect fill="#e2e8f0" x="812" y="730" width="250" height="14" rx="4"/>
  <rect fill="#e2e8f0" x="812" y="755" width="300" height="10" rx="4"/>
  <!-- Title -->
  <text fill="#f8fafc" font-family="Inter, sans-serif" font-size="28" font-weight="800" x="600" y="50" text-anchor="middle">NusaQu Developer Theme</text>
</svg>
